name = "spotify-now-playing"
main = "spotify-now-playing.js"
compatibility_date = "2024-12-01"

[vars]
# ponytail: wildcard — the endpoint serves public, unauthenticated now-playing
# data and reads no cookies, so any origin may call it. Switch to a comma-split
# allowlist here and in corsHeaders() if the worker ever returns private data.
CORS_ORIGIN = "*"

# Secrets set via `wrangler secret put NAME`:
#   SPOTIFY_CLIENT_ID
#   SPOTIFY_CLIENT_SECRET
#   SPOTIFY_REFRESH_TOKEN
